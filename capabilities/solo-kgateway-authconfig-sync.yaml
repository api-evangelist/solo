naftiko: "1.0.0-alpha2"

info:
  title: Solo kgateway AuthConfig Sync
  description: >-
    Synchronises Naftiko capability auth declarations (OIDC, API key, OPA)
    with Solo kgateway AuthConfig CRDs so external auth at the gateway
    layer enforces the same policies Naftiko declares at the spec layer.
    When a Naftiko REST adapter routes through kgateway, this capability
    publishes the matching AuthConfig so Solo's enterprise auth (OIDC,
    JWT, API key, OPA) gates the ingress before traffic reaches Naftiko.
  tags:
    - Naftiko
    - Solo
    - Partnership
    - kgateway
    - AuthConfig
    - Identity
    - OIDC
    - OPA
  created: '2026-05-21'
  modified: '2026-05-21'

binds:
  - namespace: k8s-env
    description: Kubernetes API server + ServiceAccount token for managing Solo CRDs.
    keys:
      K8S_API_BASE: K8S_API_BASE
      K8S_API_TOKEN: K8S_API_TOKEN

capability:
  consumes:
    - namespace: solo-authconfig
      type: http
      baseUri: '{{K8S_API_BASE}}'
      authentication:
        type: bearer
        token: '{{K8S_API_TOKEN}}'
      resources:
        - name: authconfigs
          path: '/apis/enterprise.gloo.solo.io/v1/namespaces/{{namespace}}/authconfigs'
          operations:
            - { name: list-authconfigs, method: GET, inputParameters: [{ name: namespace, in: path, required: true }] }
            - { name: create-authconfig, method: POST, inputParameters: [{ name: namespace, in: path, required: true }] }
        - name: authconfig
          path: '/apis/enterprise.gloo.solo.io/v1/namespaces/{{namespace}}/authconfigs/{{name}}'
          operations:
            - { name: get-authconfig, method: GET, inputParameters: [{ name: namespace, in: path, required: true }, { name: name, in: path, required: true }] }
            - { name: update-authconfig, method: PUT, inputParameters: [{ name: namespace, in: path, required: true }, { name: name, in: path, required: true }] }
            - { name: delete-authconfig, method: DELETE, inputParameters: [{ name: namespace, in: path, required: true }, { name: name, in: path, required: true }] }

  exposes:
    - type: rest
      address: 0.0.0.0
      port: 8080
      namespace: solo-kgateway-authconfig-sync-rest
      description: REST surface for managing kgateway AuthConfig CRDs from Naftiko.
      resources:
        - name: authconfigs
          path: '/kgateway/{namespace}/authconfigs'
          operations:
            - { name: list-authconfigs, method: GET, call: solo-authconfig.list-authconfigs, inputParameters: [{ name: namespace, in: path, required: true }] }
            - { name: create-authconfig, method: POST, call: solo-authconfig.create-authconfig, inputParameters: [{ name: namespace, in: path, required: true }] }
        - name: authconfig
          path: '/kgateway/{namespace}/authconfigs/{name}'
          operations:
            - { name: get-authconfig, method: GET, call: solo-authconfig.get-authconfig, inputParameters: [{ name: namespace, in: path, required: true }, { name: name, in: path, required: true }] }
            - { name: update-authconfig, method: PUT, call: solo-authconfig.update-authconfig, inputParameters: [{ name: namespace, in: path, required: true }, { name: name, in: path, required: true }] }
            - { name: delete-authconfig, method: DELETE, call: solo-authconfig.delete-authconfig, inputParameters: [{ name: namespace, in: path, required: true }, { name: name, in: path, required: true }] }
    - type: mcp
      address: 0.0.0.0
      port: 9090
      namespace: solo-kgateway-authconfig-sync-mcp
      transport: http
      description: MCP surface — agent tools for syncing Naftiko auth declarations with kgateway AuthConfig CRDs.
      tools:
        - { name: solo-list-authconfigs, description: List kgateway AuthConfig CRDs in a namespace., hints: { readOnly: true, idempotent: true }, call: solo-authconfig.list-authconfigs }
        - { name: solo-create-authconfig, description: Publish a Naftiko-declared auth profile as a kgateway AuthConfig., hints: { readOnly: false, idempotent: false }, call: solo-authconfig.create-authconfig }
        - { name: solo-get-authconfig, description: Get a kgateway AuthConfig CRD., hints: { readOnly: true, idempotent: true }, call: solo-authconfig.get-authconfig }
        - { name: solo-update-authconfig, description: Update a kgateway AuthConfig CRD., hints: { readOnly: false, idempotent: true }, call: solo-authconfig.update-authconfig }
        - { name: solo-delete-authconfig, description: Delete a kgateway AuthConfig CRD., hints: { readOnly: false, destructive: true }, call: solo-authconfig.delete-authconfig }
