naftiko: "1.0.0-alpha2"

info:
  title: Solo kgateway Upstream Discovery
  description: >-
    Reads Solo kgateway Upstream CRDs into Naftiko Fleet discovery so
    every Kubernetes service, Lambda function, and AI provider
    (Anthropic, OpenAI, Bedrock, Vertex, Ollama, vLLM) that kgateway
    knows about lands as a discoverable backend in Naftiko's capability
    catalog. Read-only walk suitable for periodic Fleet discovery sync.
  tags:
    - Naftiko
    - Solo
    - Partnership
    - kgateway
    - Upstream
    - Discovery
    - AI-Backends
  created: '2026-05-21'
  modified: '2026-05-21'

binds:
  - namespace: k8s-env
    description: Kubernetes API server + ServiceAccount token for reading Solo CRDs.
    keys:
      K8S_API_BASE: K8S_API_BASE
      K8S_API_TOKEN: K8S_API_TOKEN

capability:
  consumes:
    - namespace: solo-upstreams
      type: http
      baseUri: '{{K8S_API_BASE}}'
      authentication:
        type: bearer
        token: '{{K8S_API_TOKEN}}'
      resources:
        - name: upstreams
          path: '/apis/gloo.solo.io/v1/namespaces/{{namespace}}/upstreams'
          operations:
            - { name: list-upstreams, method: GET, inputParameters: [{ name: namespace, in: path, required: true }] }
        - name: upstream
          path: '/apis/gloo.solo.io/v1/namespaces/{{namespace}}/upstreams/{{name}}'
          operations:
            - { name: get-upstream, method: GET, inputParameters: [{ name: namespace, in: path, required: true }, { name: name, in: path, required: true }] }
        - name: upstreamgroups
          path: '/apis/gloo.solo.io/v1/namespaces/{{namespace}}/upstreamgroups'
          operations:
            - { name: list-upstreamgroups, method: GET, inputParameters: [{ name: namespace, in: path, required: true }] }

  exposes:
    - type: rest
      address: 0.0.0.0
      port: 8080
      namespace: solo-kgateway-upstream-discovery-rest
      description: REST surface for reading kgateway Upstreams + UpstreamGroups for Fleet discovery sync.
      resources:
        - name: upstreams
          path: '/kgateway/{namespace}/upstreams'
          operations:
            - { name: list-upstreams, method: GET, call: solo-upstreams.list-upstreams, inputParameters: [{ name: namespace, in: path, required: true }] }
        - name: upstream
          path: '/kgateway/{namespace}/upstreams/{name}'
          operations:
            - { name: get-upstream, method: GET, call: solo-upstreams.get-upstream, inputParameters: [{ name: namespace, in: path, required: true }, { name: name, in: path, required: true }] }
        - name: upstreamgroups
          path: '/kgateway/{namespace}/upstreamgroups'
          operations:
            - { name: list-upstreamgroups, method: GET, call: solo-upstreams.list-upstreamgroups, inputParameters: [{ name: namespace, in: path, required: true }] }
    - type: mcp
      address: 0.0.0.0
      port: 9090
      namespace: solo-kgateway-upstream-discovery-mcp
      transport: http
      description: MCP surface — agent tools for Fleet discovery of kgateway backends including AI providers.
      tools:
        - { name: solo-list-upstreams, description: List every kgateway Upstream (services, Lambda, AI providers) for Fleet discovery., hints: { readOnly: true, idempotent: true }, call: solo-upstreams.list-upstreams }
        - { name: solo-get-upstream, description: Get a single kgateway Upstream for Fleet enrichment., hints: { readOnly: true, idempotent: true }, call: solo-upstreams.get-upstream }
        - { name: solo-list-upstreamgroups, description: List kgateway UpstreamGroups for load-balancing topology discovery., hints: { readOnly: true, idempotent: true }, call: solo-upstreams.list-upstreamgroups }
