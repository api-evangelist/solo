naftiko: "1.0.0-alpha2"

info:
  title: Solo kgateway Route Management
  description: >-
    Manages Solo kgateway RouteTable and RouteOption CRDs from the
    Naftiko spec layer — RouteTables hold delegated routing trees
    multi-team platforms own per team; RouteOptions attach per-route
    policies (transformation, retry, timeout). When Naftiko Fleet
    composes capabilities across teams, this capability keeps the
    kgateway route topology in sync with the Naftiko-declared shape.
  tags:
    - Naftiko
    - Solo
    - Partnership
    - kgateway
    - RouteTable
    - RouteOption
    - Multi-Team
  created: '2026-05-21'
  modified: '2026-05-21'

binds:
  - namespace: k8s-env
    description: Kubernetes API server + ServiceAccount token for managing Solo CRDs.
    keys:
      K8S_API_BASE: K8S_API_BASE
      K8S_API_TOKEN: K8S_API_TOKEN

capability:
  consumes:
    - namespace: solo-routes
      type: http
      baseUri: '{{K8S_API_BASE}}'
      authentication:
        type: bearer
        token: '{{K8S_API_TOKEN}}'
      resources:
        - name: routetables
          path: '/apis/gateway.solo.io/v1/namespaces/{{namespace}}/routetables'
          operations:
            - { name: list-routetables, method: GET, inputParameters: [{ name: namespace, in: path, required: true }] }
            - { name: create-routetable, method: POST, inputParameters: [{ name: namespace, in: path, required: true }] }
        - name: routetable
          path: '/apis/gateway.solo.io/v1/namespaces/{{namespace}}/routetables/{{name}}'
          operations:
            - { name: get-routetable, method: GET, inputParameters: [{ name: namespace, in: path, required: true }, { name: name, in: path, required: true }] }
            - { name: update-routetable, method: PUT, inputParameters: [{ name: namespace, in: path, required: true }, { name: name, in: path, required: true }] }
            - { name: delete-routetable, method: DELETE, inputParameters: [{ name: namespace, in: path, required: true }, { name: name, in: path, required: true }] }
        - name: routeoptions
          path: '/apis/gateway.solo.io/v1/namespaces/{{namespace}}/routeoptions'
          operations:
            - { name: list-routeoptions, method: GET, inputParameters: [{ name: namespace, in: path, required: true }] }
            - { name: create-routeoption, method: POST, inputParameters: [{ name: namespace, in: path, required: true }] }

  exposes:
    - type: rest
      address: 0.0.0.0
      port: 8080
      namespace: solo-kgateway-route-management-rest
      description: REST surface for managing kgateway RouteTable + RouteOption CRDs from Naftiko.
      resources:
        - name: routetables
          path: '/kgateway/{namespace}/routetables'
          operations:
            - { name: list-routetables, method: GET, call: solo-routes.list-routetables, inputParameters: [{ name: namespace, in: path, required: true }] }
            - { name: create-routetable, method: POST, call: solo-routes.create-routetable, inputParameters: [{ name: namespace, in: path, required: true }] }
        - name: routetable
          path: '/kgateway/{namespace}/routetables/{name}'
          operations:
            - { name: get-routetable, method: GET, call: solo-routes.get-routetable, inputParameters: [{ name: namespace, in: path, required: true }, { name: name, in: path, required: true }] }
            - { name: update-routetable, method: PUT, call: solo-routes.update-routetable, inputParameters: [{ name: namespace, in: path, required: true }, { name: name, in: path, required: true }] }
            - { name: delete-routetable, method: DELETE, call: solo-routes.delete-routetable, inputParameters: [{ name: namespace, in: path, required: true }, { name: name, in: path, required: true }] }
        - name: routeoptions
          path: '/kgateway/{namespace}/routeoptions'
          operations:
            - { name: list-routeoptions, method: GET, call: solo-routes.list-routeoptions, inputParameters: [{ name: namespace, in: path, required: true }] }
            - { name: create-routeoption, method: POST, call: solo-routes.create-routeoption, inputParameters: [{ name: namespace, in: path, required: true }] }
    - type: mcp
      address: 0.0.0.0
      port: 9090
      namespace: solo-kgateway-route-management-mcp
      transport: http
      description: MCP surface — agent tools for managing kgateway RouteTable + RouteOption CRDs.
      tools:
        - { name: solo-list-routetables, description: List kgateway RouteTable CRDs (delegated routing trees)., hints: { readOnly: true, idempotent: true }, call: solo-routes.list-routetables }
        - { name: solo-create-routetable, description: Publish a Naftiko-composed routing tree as a kgateway RouteTable., hints: { readOnly: false, idempotent: false }, call: solo-routes.create-routetable }
        - { name: solo-get-routetable, description: Get a kgateway RouteTable CRD., hints: { readOnly: true, idempotent: true }, call: solo-routes.get-routetable }
        - { name: solo-update-routetable, description: Update a kgateway RouteTable CRD., hints: { readOnly: false, idempotent: true }, call: solo-routes.update-routetable }
        - { name: solo-delete-routetable, description: Delete a kgateway RouteTable CRD., hints: { readOnly: false, destructive: true }, call: solo-routes.delete-routetable }
        - { name: solo-list-routeoptions, description: List kgateway RouteOption CRDs (per-route policies)., hints: { readOnly: true, idempotent: true }, call: solo-routes.list-routeoptions }
        - { name: solo-create-routeoption, description: Publish a Naftiko-declared per-route policy as a kgateway RouteOption., hints: { readOnly: false, idempotent: false }, call: solo-routes.create-routeoption }
