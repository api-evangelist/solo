naftiko: "1.0.0-alpha2"

info:
  title: Solo kgateway RateLimit Sync
  description: >-
    Synchronises Naftiko capability rate-limit policies with Solo
    kgateway RateLimitConfig CRDs so the gateway enforces matching
    per-route, per-consumer, per-tier quotas declared at the Naftiko
    spec layer. When a Naftiko adapter routes through kgateway, Solo's
    RateLimitConfig descriptors guard the ingress with the same numbers
    Naftiko declares for the capability.
  tags:
    - Naftiko
    - Solo
    - Partnership
    - kgateway
    - RateLimit
    - FinOps
  created: '2026-05-21'
  modified: '2026-05-21'

binds:
  - namespace: k8s-env
    description: Kubernetes API server + ServiceAccount token for managing Solo CRDs.
    keys:
      K8S_API_BASE: K8S_API_BASE
      K8S_API_TOKEN: K8S_API_TOKEN

capability:
  consumes:
    - namespace: solo-ratelimit
      type: http
      baseUri: '{{K8S_API_BASE}}'
      authentication:
        type: bearer
        token: '{{K8S_API_TOKEN}}'
      resources:
        - name: ratelimitconfigs
          path: '/apis/ratelimit.solo.io/v1alpha1/namespaces/{{namespace}}/ratelimitconfigs'
          operations:
            - { name: list-ratelimitconfigs, method: GET, inputParameters: [{ name: namespace, in: path, required: true }] }
            - { name: create-ratelimitconfig, method: POST, inputParameters: [{ name: namespace, in: path, required: true }] }
        - name: ratelimitconfig
          path: '/apis/ratelimit.solo.io/v1alpha1/namespaces/{{namespace}}/ratelimitconfigs/{{name}}'
          operations:
            - { name: get-ratelimitconfig, method: GET, inputParameters: [{ name: namespace, in: path, required: true }, { name: name, in: path, required: true }] }
            - { name: update-ratelimitconfig, method: PUT, inputParameters: [{ name: namespace, in: path, required: true }, { name: name, in: path, required: true }] }
            - { name: delete-ratelimitconfig, method: DELETE, inputParameters: [{ name: namespace, in: path, required: true }, { name: name, in: path, required: true }] }

  exposes:
    - type: rest
      address: 0.0.0.0
      port: 8080
      namespace: solo-kgateway-ratelimit-sync-rest
      description: REST surface for managing kgateway RateLimitConfig CRDs from Naftiko.
      resources:
        - name: ratelimitconfigs
          path: '/kgateway/{namespace}/ratelimitconfigs'
          operations:
            - { name: list-ratelimitconfigs, method: GET, call: solo-ratelimit.list-ratelimitconfigs, inputParameters: [{ name: namespace, in: path, required: true }] }
            - { name: create-ratelimitconfig, method: POST, call: solo-ratelimit.create-ratelimitconfig, inputParameters: [{ name: namespace, in: path, required: true }] }
        - name: ratelimitconfig
          path: '/kgateway/{namespace}/ratelimitconfigs/{name}'
          operations:
            - { name: get-ratelimitconfig, method: GET, call: solo-ratelimit.get-ratelimitconfig, inputParameters: [{ name: namespace, in: path, required: true }, { name: name, in: path, required: true }] }
            - { name: update-ratelimitconfig, method: PUT, call: solo-ratelimit.update-ratelimitconfig, inputParameters: [{ name: namespace, in: path, required: true }, { name: name, in: path, required: true }] }
            - { name: delete-ratelimitconfig, method: DELETE, call: solo-ratelimit.delete-ratelimitconfig, inputParameters: [{ name: namespace, in: path, required: true }, { name: name, in: path, required: true }] }
    - type: mcp
      address: 0.0.0.0
      port: 9090
      namespace: solo-kgateway-ratelimit-sync-mcp
      transport: http
      description: MCP surface — agent tools for syncing Naftiko rate-limit policies with kgateway RateLimitConfig CRDs.
      tools:
        - { name: solo-list-ratelimitconfigs, description: List kgateway RateLimitConfig CRDs in a namespace., hints: { readOnly: true, idempotent: true }, call: solo-ratelimit.list-ratelimitconfigs }
        - { name: solo-create-ratelimitconfig, description: Publish a Naftiko-declared rate-limit policy as a kgateway RateLimitConfig., hints: { readOnly: false, idempotent: false }, call: solo-ratelimit.create-ratelimitconfig }
        - { name: solo-get-ratelimitconfig, description: Get a kgateway RateLimitConfig CRD., hints: { readOnly: true, idempotent: true }, call: solo-ratelimit.get-ratelimitconfig }
        - { name: solo-update-ratelimitconfig, description: Update a kgateway RateLimitConfig CRD., hints: { readOnly: false, idempotent: true }, call: solo-ratelimit.update-ratelimitconfig }
        - { name: solo-delete-ratelimitconfig, description: Delete a kgateway RateLimitConfig CRD., hints: { readOnly: false, destructive: true }, call: solo-ratelimit.delete-ratelimitconfig }
