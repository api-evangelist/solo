naftiko: "1.0.0-alpha2"

info:
  title: Solo kagent Agent Deploy
  description: >-
    Manages Solo kagent Agent + Team CRDs so Naftiko-authored agent
    capabilities deploy into Kubernetes as kagent workloads with
    OTel observability, RBAC, NetworkPolicy, and connections to
    agentgateway for downstream LLM/MCP access. When Naftiko Fleet
    composes a capability that targets an autonomous agent runtime,
    this capability emits the kagent Agent CRD so Solo runs it.
  tags:
    - Naftiko
    - Solo
    - Partnership
    - kagent
    - AI-Agent
    - Kubernetes
  created: '2026-05-21'
  modified: '2026-05-21'

binds:
  - namespace: k8s-env
    description: Kubernetes API server + ServiceAccount token for managing Solo CRDs.
    keys:
      K8S_API_BASE: K8S_API_BASE
      K8S_API_TOKEN: K8S_API_TOKEN

capability:
  consumes:
    - namespace: solo-kagent
      type: http
      baseUri: '{{K8S_API_BASE}}'
      authentication:
        type: bearer
        token: '{{K8S_API_TOKEN}}'
      resources:
        - name: agents
          path: '/apis/kagent.dev/v1alpha1/namespaces/{{namespace}}/agents'
          operations:
            - { name: list-agents, method: GET, inputParameters: [{ name: namespace, in: path, required: true }] }
            - { name: create-agent, method: POST, inputParameters: [{ name: namespace, in: path, required: true }] }
        - name: agent
          path: '/apis/kagent.dev/v1alpha1/namespaces/{{namespace}}/agents/{{name}}'
          operations:
            - { name: get-agent, method: GET, inputParameters: [{ name: namespace, in: path, required: true }, { name: name, in: path, required: true }] }
            - { name: update-agent, method: PUT, inputParameters: [{ name: namespace, in: path, required: true }, { name: name, in: path, required: true }] }
            - { name: delete-agent, method: DELETE, inputParameters: [{ name: namespace, in: path, required: true }, { name: name, in: path, required: true }] }
        - name: teams
          path: '/apis/kagent.dev/v1alpha1/namespaces/{{namespace}}/teams'
          operations:
            - { name: list-teams, method: GET, inputParameters: [{ name: namespace, in: path, required: true }] }
            - { name: create-team, method: POST, inputParameters: [{ name: namespace, in: path, required: true }] }

  exposes:
    - type: rest
      address: 0.0.0.0
      port: 8080
      namespace: solo-kagent-agent-deploy-rest
      description: REST surface for managing kagent Agent + Team CRDs from Naftiko.
      resources:
        - name: agents
          path: '/kagent/{namespace}/agents'
          operations:
            - { name: list-agents, method: GET, call: solo-kagent.list-agents, inputParameters: [{ name: namespace, in: path, required: true }] }
            - { name: create-agent, method: POST, call: solo-kagent.create-agent, inputParameters: [{ name: namespace, in: path, required: true }] }
        - name: agent
          path: '/kagent/{namespace}/agents/{name}'
          operations:
            - { name: get-agent, method: GET, call: solo-kagent.get-agent, inputParameters: [{ name: namespace, in: path, required: true }, { name: name, in: path, required: true }] }
            - { name: update-agent, method: PUT, call: solo-kagent.update-agent, inputParameters: [{ name: namespace, in: path, required: true }, { name: name, in: path, required: true }] }
            - { name: delete-agent, method: DELETE, call: solo-kagent.delete-agent, inputParameters: [{ name: namespace, in: path, required: true }, { name: name, in: path, required: true }] }
        - name: teams
          path: '/kagent/{namespace}/teams'
          operations:
            - { name: list-teams, method: GET, call: solo-kagent.list-teams, inputParameters: [{ name: namespace, in: path, required: true }] }
            - { name: create-team, method: POST, call: solo-kagent.create-team, inputParameters: [{ name: namespace, in: path, required: true }] }
    - type: mcp
      address: 0.0.0.0
      port: 9090
      namespace: solo-kagent-agent-deploy-mcp
      transport: http
      description: MCP surface — agent tools for deploying Naftiko-authored agents to Solo kagent.
      tools:
        - { name: solo-list-kagents, description: List kagent Agent CRDs in a namespace., hints: { readOnly: true, idempotent: true }, call: solo-kagent.list-agents }
        - { name: solo-create-kagent, description: Deploy a Naftiko-authored agent as a kagent Agent CRD., hints: { readOnly: false, idempotent: false }, call: solo-kagent.create-agent }
        - { name: solo-get-kagent, description: Get a kagent Agent CRD., hints: { readOnly: true, idempotent: true }, call: solo-kagent.get-agent }
        - { name: solo-update-kagent, description: Update a kagent Agent CRD., hints: { readOnly: false, idempotent: true }, call: solo-kagent.update-agent }
        - { name: solo-delete-kagent, description: Delete a kagent Agent CRD., hints: { readOnly: false, destructive: true }, call: solo-kagent.delete-agent }
        - { name: solo-list-kagent-teams, description: List kagent Team CRDs (multi-agent collaboration groups)., hints: { readOnly: true, idempotent: true }, call: solo-kagent.list-teams }
        - { name: solo-create-kagent-team, description: Publish a Naftiko-composed multi-agent Team as a kagent Team CRD., hints: { readOnly: false, idempotent: false }, call: solo-kagent.create-team }
