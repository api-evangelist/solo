naftiko: "1.0.0-alpha2"

info:
  title: Solo kgateway VirtualService Publish
  description: >-
    Publishes Naftiko REST adapters as Solo kgateway VirtualService CRDs.
    When Naftiko ships an `exposes: rest` capability into a Kubernetes
    cluster running Solo Enterprise for kgateway, this capability
    registers the matching VirtualService so kgateway routes ingress
    traffic to the Naftiko adapter through Envoy with Solo's auth,
    rate-limit, and transformation policies layered on top.
  tags:
    - Naftiko
    - Solo
    - Partnership
    - kgateway
    - VirtualService
    - API-Gateway
  created: '2026-05-21'
  modified: '2026-05-21'

binds:
  - namespace: k8s-env
    description: Kubernetes API server + ServiceAccount token for managing Solo CRDs.
    keys:
      K8S_API_BASE: K8S_API_BASE
      K8S_API_TOKEN: K8S_API_TOKEN

capability:
  consumes:
    - namespace: solo-kgateway
      type: http
      baseUri: '{{K8S_API_BASE}}'
      authentication:
        type: bearer
        token: '{{K8S_API_TOKEN}}'
      resources:
        - name: virtualservices
          path: '/apis/gateway.solo.io/v1/namespaces/{{namespace}}/virtualservices'
          operations:
            - name: list-virtualservices
              method: GET
              inputParameters:
                - { name: namespace, in: path, required: true }
            - name: create-virtualservice
              method: POST
              inputParameters:
                - { name: namespace, in: path, required: true }
        - name: virtualservice
          path: '/apis/gateway.solo.io/v1/namespaces/{{namespace}}/virtualservices/{{name}}'
          operations:
            - name: get-virtualservice
              method: GET
              inputParameters:
                - { name: namespace, in: path, required: true }
                - { name: name, in: path, required: true }
            - name: update-virtualservice
              method: PUT
              inputParameters:
                - { name: namespace, in: path, required: true }
                - { name: name, in: path, required: true }
            - name: delete-virtualservice
              method: DELETE
              inputParameters:
                - { name: namespace, in: path, required: true }
                - { name: name, in: path, required: true }

  exposes:
    - type: rest
      address: 0.0.0.0
      port: 8080
      namespace: solo-kgateway-virtualservice-publish-rest
      description: REST surface for managing kgateway VirtualService CRDs from Naftiko.
      resources:
        - name: virtualservices
          path: '/kgateway/{namespace}/virtualservices'
          operations:
            - { name: list-virtualservices, method: GET, call: solo-kgateway.list-virtualservices, inputParameters: [{ name: namespace, in: path, required: true }] }
            - { name: create-virtualservice, method: POST, call: solo-kgateway.create-virtualservice, inputParameters: [{ name: namespace, in: path, required: true }] }
        - name: virtualservice
          path: '/kgateway/{namespace}/virtualservices/{name}'
          operations:
            - { name: get-virtualservice, method: GET, call: solo-kgateway.get-virtualservice, inputParameters: [{ name: namespace, in: path, required: true }, { name: name, in: path, required: true }] }
            - { name: update-virtualservice, method: PUT, call: solo-kgateway.update-virtualservice, inputParameters: [{ name: namespace, in: path, required: true }, { name: name, in: path, required: true }] }
            - { name: delete-virtualservice, method: DELETE, call: solo-kgateway.delete-virtualservice, inputParameters: [{ name: namespace, in: path, required: true }, { name: name, in: path, required: true }] }
    - type: mcp
      address: 0.0.0.0
      port: 9090
      namespace: solo-kgateway-virtualservice-publish-mcp
      transport: http
      description: MCP surface — agent tools for publishing Naftiko REST adapters as kgateway VirtualServices.
      tools:
        - { name: solo-list-virtualservices, description: List kgateway VirtualService CRDs in a namespace., hints: { readOnly: true, idempotent: true }, call: solo-kgateway.list-virtualservices }
        - { name: solo-create-virtualservice, description: Publish a Naftiko REST adapter as a kgateway VirtualService., hints: { readOnly: false, idempotent: false }, call: solo-kgateway.create-virtualservice }
        - { name: solo-get-virtualservice, description: Get a single kgateway VirtualService., hints: { readOnly: true, idempotent: true }, call: solo-kgateway.get-virtualservice }
        - { name: solo-update-virtualservice, description: Update a kgateway VirtualService for a Naftiko REST adapter., hints: { readOnly: false, idempotent: true }, call: solo-kgateway.update-virtualservice }
        - { name: solo-delete-virtualservice, description: Delete a kgateway VirtualService., hints: { readOnly: false, destructive: true }, call: solo-kgateway.delete-virtualservice }
